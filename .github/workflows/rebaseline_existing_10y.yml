name: Existing strategies 2016-or-earliest rebaseline

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [ready_for_review]
    paths:
      - "scripts/run_existing_10y_rebaseline.py"
      - ".github/workflows/rebaseline_existing_10y.yml"

permissions:
  contents: read

concurrency:
  group: existing-10y-rebaseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rebaseline:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[10y-rebaseline]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and data dependencies
        run: python -m pip install --disable-pip-version-check -e . pytest pandas dukascopy-python

      - name: Run deterministic strategy tests once
        run: >-
          python -m pytest
          tests/test_ai2_eth.py
          tests/test_ai8_btc.py
          tests/test_ai38_gbpusd.py
          tests/test_ai58_usdjpy.py
          tests/test_ai58_source_fidelity.py
          tests/test_triple_macd_nq.py
          -q

      - name: Fetch earliest available Binance BTCUSDT 2h history
        run: >-
          python scripts/fetch_binance_btcusdt_2h.py
          --start 2017-08-17
          --end 2026-09-16
          --market spot
          --output rebaseline_data/btcusdt_2h.csv

      - name: Fetch earliest available Binance ETHUSDT 15m history
        run: >-
          python scripts/fetch_binance_ethusdt_15m.py
          --start 2017-08-17
          --end 2026-09-16
          --output rebaseline_data/ethusdt_15m.csv
          --summary rebaseline_data/ethusdt_15m_summary.json

      - name: Fetch GBPUSD warmup plus 2016-present history
        run: >-
          python scripts/fetch_dukascopy_gbpusd_4h.py
          --start 2015-01-01
          --end 2026-09-16
          --output-dir rebaseline_data/gbpusd

      - name: Fetch USDJPY warmup plus 2016-present history
        run: >-
          python scripts/fetch_dukascopy_usdjpy.py
          --start 2015-01-01
          --end 2026-09-16
          --output-dir rebaseline_data/usdjpy

      - name: Run standardized AI8 AI2 AI38 AI58 rebaseline
        run: >-
          python scripts/run_existing_10y_rebaseline.py
          --btc rebaseline_data/btcusdt_2h.csv
          --eth rebaseline_data/ethusdt_15m.csv
          --gbp rebaseline_data/gbpusd/gbpusd_mid_4h_offset2.csv
          --jpy rebaseline_data/usdjpy/usdjpy_mid_15m.csv
          --end 2026-09-16
          --output rebaseline_results/existing_10y_rebaseline.json

      - name: Recheck EXP6 earliest current public history
        run: |
          python scripts/run_exp6_public_regimes.py --out-dir rebaseline_results/exp6_public_regimes
          python scripts/run_exp6_2026_sample.py --out-dir rebaseline_results/exp6_2026_sample

      - name: Write compact summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          d=json.loads(Path('rebaseline_results/existing_10y_rebaseline.json').read_text())
          print('# 2016-or-earliest rebaseline')
          print()
          print('| Strategy | Coverage start | Trades | Net % | PF | DD % | 2x-cost net % | 2x-cost PF |')
          print('|---|---|---:|---:|---:|---:|---:|---:|')
          for key,row in d['strategies'].items():
              m=row['full_history']; c=row['full_history_2x_costs']
              dd=m.get('max_closed_trade_drawdown_pct', m.get('max_drawdown_pct_closed_trade'))
              print(f"| {key} | {row['scored_start'][:10]} | {m['trades']} | {m['net_profit_pct']:.2f} | {m['profit_factor']:.3f} | {dd:.2f} | {c['net_profit_pct']:.2f} | {c['profit_factor']:.3f} |")
          print()
          print('EXP6: currently validated public continuous history begins in 2023; it cannot satisfy the 2016 coverage gate yet.')
          PY

      - name: Upload rebaseline evidence
        uses: actions/upload-artifact@v4
        with:
          name: existing-strategies-10y-rebaseline
          path: |
            rebaseline_results/
            rebaseline_data/*summary.json
          retention-days: 14
