name: AI8 automated health monitor

on:
  schedule:
    # Daily at 06:15 UTC, after the prior UTC crypto day is complete and archived.
    - cron: "15 6 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ai8_health_monitor.yml"
      - "scripts/run_ai8_health_monitor.py"
      - "scripts/render_ai8_health_report.py"
      - "scripts/fetch_binance_btcusdt_2h.py"
      - "ai_investing_lab/strategies/ai8_btc/**"
      - "tests/test_ai8_btc.py"

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run AI8 regression tests
        run: python -m unittest tests.test_ai8_btc -v

      - name: Resolve monitoring horizon
        id: horizon
        shell: bash
        run: |
          set -euo pipefail
          END_DATE="$(date -u +%F)"
          echo "end_date=${END_DATE}" >> "$GITHUB_OUTPUT"
          echo "AI8 monitor end date (exclusive): ${END_DATE}"

      - name: Fetch latest Binance Spot BTCUSDT 2h history
        run: |
          mkdir -p health_data health_artifacts
          python scripts/fetch_binance_btcusdt_2h.py \
            --start 2017-08-17 \
            --end "${{ steps.horizon.outputs.end_date }}" \
            --market spot \
            --output health_data/btcusdt_spot_2h.csv

      - name: Recompute frozen AI8 health state
        run: |
          python scripts/run_ai8_health_monitor.py \
            health_data/btcusdt_spot_2h.csv \
            --analysis-end "${{ steps.horizon.outputs.end_date }}" \
            --output health_artifacts/ai8_health.json \
            > health_artifacts/console_summary.json
          cp health_data/btcusdt_spot_2h.summary.json health_artifacts/data_summary.json

      - name: Render health report
        id: health
        run: |
          python scripts/render_ai8_health_report.py \
            health_artifacts/ai8_health.json \
            --markdown health_artifacts/AI8_HEALTH.md \
            --github-output "$GITHUB_OUTPUT"
          cat health_artifacts/AI8_HEALTH.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload daily health artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai8-health-${{ steps.horizon.outputs.end_date }}
          path: health_artifacts/
          retention-days: 30

      - name: Raise or clear AI8 health alert
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CLASSIFICATION: ${{ steps.health.outputs.classification }}
          HEADLINE: ${{ steps.health.outputs.headline }}
        shell: bash
        run: |
          set -euo pipefail
          EXISTING="$(gh issue list --repo "$REPO" --state open --search 'AI8 Health Alert in:title' --json number --jq '.[0].number // empty')"

          if [[ "$CLASSIFICATION" == "high_risk_dormant" || "$CLASSIFICATION" == "structural_concern" ]]; then
            TITLE="AI8 Health Alert — ${HEADLINE}"
            if [[ -z "$EXISTING" ]]; then
              gh issue create --repo "$REPO" --title "$TITLE" --body-file health_artifacts/AI8_HEALTH.md
            else
              gh issue edit "$EXISTING" --repo "$REPO" --title "$TITLE" --body-file health_artifacts/AI8_HEALTH.md
            fi
          elif [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "AI8 returned to ${HEADLINE}. Closing the automated health alert. Daily research monitoring continues."
            gh issue close "$EXISTING" --repo "$REPO" --reason completed
          fi
