name: Bootstrap sanitized Gold AI Strategy snapshot

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/xz/**"
      - ".github/workflows/bootstrap_public_snapshot.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-public-snapshot
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify sanitized bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/xz/chunk_* | base64 -d > /tmp/gold-public.tar.xz
          test "$(wc -c < /tmp/gold-public.tar.xz | tr -d ' ')" = "104820"
          echo "a66be793ba33388e1a8d7e87a01154ce2aefe33acb0f56704d237b1a6297ec40  /tmp/gold-public.tar.xz" | sha256sum -c -

      - name: Extract and privacy-check snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gold-public
          mkdir -p /tmp/gold-public
          tar -xJf /tmp/gold-public.tar.xz -C /tmp/gold-public

          # Legacy source workflows are intentionally not published. A lean
          # public CI workflow is installed separately after this bootstrap.
          rm -rf /tmp/gold-public/.github/workflows

          if find /tmp/gold-public -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' \) -print | grep -q .; then
            echo "Sensitive-looking file type found; refusing to publish."
            exit 1
          fi

          if grep -RIlE '22474\.95|snapshots\.db|github_pat_|ghp_[A-Za-z0-9]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' /tmp/gold-public; then
            echo "Privacy scan failed; refusing to publish."
            exit 1
          fi

      - name: Install sanitized snapshot
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/gold-public/. .
          rm -rf .bootstrap

      - name: Commit public baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Publish sanitized Gold AI Strategy baseline"
          git push
