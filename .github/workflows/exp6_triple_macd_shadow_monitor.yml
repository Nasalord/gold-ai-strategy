name: EXP6 Triple MACD NQ shadow monitor

on:
  schedule:
    # Weekly research check after the public NQ source has had time to update.
    - cron: "15 12 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/exp6_triple_macd_shadow_monitor.yml"
      - "scripts/run_exp6_shadow_monitor.py"
      - "scripts/run_exp6_2026_sample.py"
      - "ai_investing_lab/strategies/triple_macd_nq/**"
      - "tests/test_triple_macd_nq.py"

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run Triple MACD regression tests
        run: python -m pytest tests/test_triple_macd_nq.py -q
      - name: Recompute frozen shadow health
        run: |
          rm -rf exp6_shadow_health
          python scripts/run_exp6_shadow_monitor.py | tee exp6_shadow_console.txt
          cp exp6_shadow_console.txt exp6_shadow_health/console.txt
          test -s exp6_shadow_health/exp6_health.json
          test -s exp6_shadow_health/EXP6_HEALTH.md
          cat exp6_shadow_health/EXP6_HEALTH.md >> "$GITHUB_STEP_SUMMARY"
      - name: Read classification
        id: health
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('exp6_shadow_health/exp6_health.json'))
          print('classification='+d['classification'])
          print('headline='+d['headline'])
          PY
      - name: Upload shadow-health artifact
        uses: actions/upload-artifact@v4
        with:
          name: exp6-triple-macd-nq-shadow-health
          path: exp6_shadow_health/
          retention-days: 30
      - name: Raise or clear structural health issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CLASSIFICATION: ${{ steps.health.outputs.classification }}
          HEADLINE: ${{ steps.health.outputs.headline }}
        shell: bash
        run: |
          set -euo pipefail
          EXISTING="$(gh issue list --repo "$REPO" --state open --search 'EXP6 Triple MACD Health Alert in:title' --json number --jq '.[0].number // empty')"
          if [[ "$CLASSIFICATION" == "structural_concern" ]]; then
            TITLE="EXP6 Triple MACD Health Alert — ${HEADLINE}"
            if [[ -z "$EXISTING" ]]; then
              gh issue create --repo "$REPO" --title "$TITLE" --body-file exp6_shadow_health/EXP6_HEALTH.md
            else
              gh issue edit "$EXISTING" --repo "$REPO" --title "$TITLE" --body-file exp6_shadow_health/EXP6_HEALTH.md
            fi
          elif [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "EXP6 no longer meets the frozen structural-concern rule. Closing the alert; shadow monitoring continues."
            gh issue close "$EXISTING" --repo "$REPO" --reason completed
          fi
