name: Stage 3B small-account $5k feasibility

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [ready_for_review]
    paths:
      - "scripts/run_small_account_5k.py"
      - ".github/workflows/small_account_5k.yml"

permissions:
  contents: read

concurrency:
  group: small-account-5k-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stage3b:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[5k-stage3b]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and data dependencies
        run: python -m pip install --disable-pip-version-check -e . pytest pandas dukascopy-python

      - name: Compile runner and run frozen-engine regression tests once
        run: |
          python -m py_compile scripts/run_small_account_5k.py
          python -m pytest tests/test_ai2_eth.py tests/test_ai8_btc.py tests/test_ai38_gbpusd.py tests/test_ai58_usdjpy.py tests/test_ai58_source_fidelity.py -q

      - name: Fetch earliest available Binance BTCUSDT 2h history
        run: >-
          python scripts/fetch_binance_btcusdt_2h.py
          --start 2017-08-17
          --end 2026-09-16
          --market spot
          --output small_account_data/btcusdt_2h.csv

      - name: Fetch earliest available Binance ETHUSDT 15m history
        run: >-
          python scripts/fetch_binance_ethusdt_15m.py
          --start 2017-08-17
          --end 2026-09-16
          --output small_account_data/ethusdt_15m.csv
          --summary small_account_data/ethusdt_15m_summary.json

      - name: Fetch GBPUSD warmup plus 2016-present history
        run: >-
          python scripts/fetch_dukascopy_gbpusd_4h.py
          --start 2015-01-01
          --end 2026-09-16
          --output-dir small_account_data/gbpusd

      - name: Fetch USDJPY warmup plus 2016-present history
        run: >-
          python scripts/fetch_dukascopy_usdjpy.py
          --start 2015-01-01
          --end 2026-09-16
          --output-dir small_account_data/usdjpy

      - name: Run Stage 3B $5k feasibility
        run: >-
          python scripts/run_small_account_5k.py
          --btc small_account_data/btcusdt_2h.csv
          --eth small_account_data/ethusdt_15m.csv
          --gbp small_account_data/gbpusd/gbpusd_mid_4h_offset2.csv
          --jpy small_account_data/usdjpy/usdjpy_mid_15m.csv
          --end 2026-09-16
          --output small_account_results/stage3b_5k.json

      - name: Write compact summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          d=json.loads(Path('small_account_results/stage3b_5k.json').read_text())
          print('# Stage 3B — $5k small-account feasibility')
          print()
          print('| Strategy | Class | Ending equity | Net % | CAGR % | PF | DD % | 2x-cost ending | 2x PF |')
          print('|---|---|---:|---:|---:|---:|---:|---:|---:|')
          for key,row in d['strategies'].items():
              m=row['baseline']; c=row['double_costs']
              cagr=m['cagr_pct'] if m['cagr_pct'] is not None else float('nan')
              print(f"| {key} | {row['classification']} | ${m['ending_equity_usd']:.2f} | {m['net_profit_pct']:.2f} | {cagr:.2f} | {m['profit_factor']:.3f} | {m['max_closed_trade_drawdown_pct']:.2f} | ${c['ending_equity_usd']:.2f} | {c['profit_factor']:.3f} |")
          PY

      - name: Upload Stage 3B evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage3b-small-account-5k
          path: |
            small_account_results/
            small_account_data/*summary.json
          retention-days: 14
