name: AI15 2016-present long-history validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [ready_for_review, synchronize]
    paths:
      - "ai_investing_lab/strategies/ai15_triple_ma/**"
      - "tests/test_ai15_triple_ma.py"
      - "scripts/run_ai15_long_history.py"
      - "docs/AI15_SIMPLE_TRIPLE_MA.md"
      - ".github/workflows/ai15_long_history.yml"

permissions:
  contents: read

concurrency:
  group: ai15-long-history-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-long-history:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[full-validate]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and tests
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Run deterministic AI15 tests
        run: python -m pytest tests/test_ai15_triple_ma.py -q
      - name: Run pinned 2016-present AI15 validation
        run: python scripts/run_ai15_long_history.py
      - name: Show long-history research summary
        run: cat ai15_long_history/AI15_LONG_HISTORY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload compact AI15 long-history bundle
        uses: actions/upload-artifact@v4
        with:
          name: ai15-2016-present-long-history
          path: ai15_long_history/
          retention-days: 14
